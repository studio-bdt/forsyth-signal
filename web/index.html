<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forsyth Signal</title>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preconnect" href="https://tile.openstreetmap.org">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css">
    <link rel="stylesheet" href="styles.css?v=clickable-nearby-events">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <header id="header">
            <div id="header-content">
                <h1>Forsyth Signal</h1>
            </div>
        </header>

        <main id="main">
            <aside id="events-panel" class="mobile-panel">
                <div id="events-header">
                    <h2>Events</h2>
                    <button class="panel-close" type="button" aria-label="Close events panel">×</button>
                </div>
                <div class="mobile-scroll-hint" aria-hidden="true">
                    Swipe or scroll to browse <span>↓</span>
                </div>

                <div id="event-tabs">
                    <button class="event-tab is-active" data-state="upcoming">Upcoming</button>
                    <button class="event-tab" data-state="active">Active</button>
                    <button class="event-tab" data-state="past">Past</button>
                    <button class="event-tab" data-state="schools">Schools</button>
                </div>

                <div id="event-filters">
                    <select id="category-filter">
                        <option value="all">All categories</option>
                        <option value="development">Development</option>
                        <option value="government">Government</option>
                        <option value="education">Education</option>
                        <option value="transportation">Transportation</option>
                        <option value="community">Community</option>
                        <option value="public-notice">Public notices</option>
                    </select>
                </div>

                <div class="search-field">
                    <input id="search" type="search" placeholder="Search events..." aria-label="Search events">
                    <button class="search-clear" type="button" aria-label="Clear event search" hidden>×</button>
                </div>
                <div id="event-count" role="status" aria-live="polite"></div>
                <button id="events-back-to-top" type="button" hidden>↑ Back to top</button>
                <div id="event-list-container">
                    <div id="events"></div>
                </div>
            </aside>

            <section id="map-container">
                <div id="map-search">
                    <div class="search-field">
                        <input id="location-search" type="search" placeholder="Search the map..." aria-label="Search the map">
                        <button class="search-clear" type="button" aria-label="Clear map search" hidden>×</button>
                    </div>
                    <div id="location-results"></div>
                </div>
                <div id="mobile-panel-controls" aria-label="Map panels">
                    <button type="button" data-panel="events-panel" aria-controls="events-panel" aria-expanded="false">Events</button>
                    <button type="button" data-panel="details-panel" aria-controls="details-panel" aria-expanded="false">Details</button>
                </div>
                <div id="address-panel">
                    <div class="address-panel-header">
                        <div class="address-heading">What affects me?</div>
                        <div class="address-panel-actions">
                            <button id="address-close" type="button" aria-label="Close What affects me">×</button>
                        </div>
                    </div>

                    <div class="address-content">
                        <div class="address-description">
                            Enter an address to find nearby events,
                            developments, and public meetings.
                        </div>

                        <div class="address-input-row">
                            <input id="address-search" type="search" placeholder="Enter an address...">
                            <button id="address-submit">Find</button>
                        </div>

                        <div id="address-results"></div>
                    </div>
                </div>
                <button id="address-reopen" type="button" aria-label="Open What affects me" hidden>What affects me?</button>

                <section id="event-group-panel" aria-labelledby="event-group-title" hidden>
                    <header class="event-group-header">
                        <div>
                            <h2 id="event-group-title"></h2>
                            <div id="event-group-count"></div>
                        </div>
                        <button id="event-group-close" type="button" aria-label="Close event list">×</button>
                    </header>
                    <div id="event-group-list"></div>
                </section>

                <div id="map"></div>
            </section>

            <aside id="details-panel" class="mobile-panel">
                <div id="details-header">
                    <h2>Details</h2>
                    <button class="panel-close" type="button" aria-label="Close details panel">×</button>
                </div>
                <div class="mobile-scroll-hint" aria-hidden="true">
                    Swipe or scroll for full details <span>↓</span>
                </div>

                <div id="details">
                    <p>Select an event</p>
                </div>
            </aside>
        </main>

        <footer id="footer">
            <span>Forsyth Signal</span>
            <span>Built by <a href="https://studio-bdt.github.io" target="_blank" id="bdt-link">Studio BDT</a></span>
        </footer>
    </div>

    <script type="module" src="js/main.js?v=clickable-nearby-events"></script>

</body>

</html>
